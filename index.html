<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Interactive card details form</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style></style>
  </head>
  <body>
    <div class="banner" aria-hidden="true"></div>

    <div class="cards" aria-hidden="true">
      <div class="card card-front">
        <div class="logo">
          <img src="images/card-logo.svg" alt="" />
          <!-- <span class="logo-big"></span><span class="logo-small"></span> -->
        </div>
        <p class="front-number" id="card-number-display">0000 0000 0000 0000</p>
        <div class="front-meta">
          <span id="card-name-display">Jane Appleseed</span>
          <span
            ><span id="card-month-display">00</span>/<span
              id="card-year-display"
              >00</span
            ></span
          >
        </div>
      </div>
      <div class="card card-back">
        <div class="stripe"></div>
        <div class="cvc-band"><span id="card-cvc-display">000</span></div>
        <div class="fine-print">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
    </div>

    <main class="panel">
      <form id="card-form" novalidate>
        <div class="field">
          <label for="name">Cardholder Name</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="e.g. Jane Appleseed"
            autocomplete="cc-name"
          />
          <p class="error" id="name-error" role="alert"></p>
        </div>

        <div class="field">
          <label for="number">Card Number</label>
          <input
            type="text"
            id="number"
            name="number"
            placeholder="e.g. 1234 5678 9123 0000"
            inputmode="numeric"
            autocomplete="cc-number"
            maxlength="19"
          />
          <p class="error" id="number-error" role="alert"></p>
        </div>

        <div class="row">
          <div class="field exp">
            <label for="month">Exp. Date (MM/YY)</label>
            <div class="exp-inputs">
              <input
                type="text"
                id="month"
                name="month"
                placeholder="MM"
                inputmode="numeric"
                maxlength="2"
                autocomplete="cc-exp-month"
                aria-label="Expiry month"
              />
              <input
                type="text"
                id="year"
                name="year"
                placeholder="YY"
                inputmode="numeric"
                maxlength="2"
                autocomplete="cc-exp-year"
                aria-label="Expiry year"
              />
            </div>
            <p class="error" id="exp-error" role="alert"></p>
          </div>

          <div class="field cvc">
            <label for="cvc">CVC</label>
            <input
              type="text"
              id="cvc"
              name="cvc"
              placeholder="e.g. 123"
              inputmode="numeric"
              maxlength="3"
              autocomplete="cc-csc"
            />
            <p class="error" id="cvc-error" role="alert"></p>
          </div>
        </div>

        <button type="submit" class="btn">Confirm</button>
      </form>
      <!-- Completed state start -->
      <section class="thanks" id="thanks" hidden>
        <div class="tick">
          <img src="images/icon-complete.svg" alt="" />
        </div>
        <h1>Thank you!</h1>
        <p>We've added your card details</p>
        <button type="button" class="btn" id="continue">Continue</button>
      </section>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
    <script src="script.js"></script>
  </body>
</html>
